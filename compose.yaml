services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bgin_agent
      POSTGRES_USER: bgin
      POSTGRES_PASSWORD: bgin_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bgin -d bgin_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
